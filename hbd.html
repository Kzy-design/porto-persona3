<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday!</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f7a8b8; /* Warna background pink */
      font-family: 'Poppins', sans-serif;
    }

    .card {
      position: relative;
      width: 300px;
      height: 400px;
      background-color: #fff;
      transform-style: preserve-3d;
      perspective: 1000px;
      box-shadow: 10px 20px 40px rgba(0, 0, 0, 0.25);
      border-radius: 10px;
      cursor: pointer;
    }

    /* Efek animasi terlipat saat diarahkan kursor (hover) */
    .card:hover .cover {
      transform: rotateY(-180deg);
    }

    /* Sampul Depan */
    .cover {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #fafafa;
      border-radius: 10px;
      transform-origin: left;
      transform-style: preserve-3d;
      transition: transform 1s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
    }

    .cover img {
      width: 180px;
      height: auto;
      margin-top: 15px;
    }

    .cover h2 {
      font-size: 20px;
      color: #333;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    /* Isi Bagian Dalam Kartu */
    .details {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      background-color: #ffffff;
      border-radius: 10px;
      z-index: 1;
    }

    .details h1 {
      font-size: 22px;
      color: #e91e63;
      margin-bottom: 15px;
    }

    .details p {
      font-size: 13px;
      color: #555;
      line-height: 1.6;
      margin-bottom: 10px;
    }

    .details .sender {
      margin-top: 15px;
      font-weight: bold;
      color: #888;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <!-- Audio Musik Latar -->
  <audio autoplay loop id="bg-music">
    <source src="musik.mp3" type="audio/mpeg">
  </audio>

  <!-- Kartu Ucapan -->
  <div class="card">
    <!-- Sampul Luar -->
    <div class="cover">
      <h2>Happy Birthday</h2>
      <!-- Ganti link gambar sesuai ilustrasi yang kamu mau -->
      <img src="https://cdn-icons-png.flaticon.com/512/2488/2488614.png" alt="Birthday Illustration">
    </div>

    <!-- Isi Kartu Ulang Tahun -->
    <div class="details">
      <h1>HAPPY BIRTHDAY TO YOU! 🎉</h1>
      <p>Selamat ulang tahun ya!</p>
      <p>Semoga di usiamu yang baru ini selalu diberikan kesehatan, kebahagiaan, dan kemudahan dalam segala hal.</p>
      <p>Terima kasih sudah menjadi teman yang luar biasa selama ini! ✨</p>
      <p class="sender">- Dari Sahabatmu</p>
    </div>
  </div>

  <script>
    // Memastikan musik diputar otomatis saat pengguna berinteraksi pertama kali
    document.body.addEventListener('click', function() {
      var music = document.getElementById('bg-music');
      if (music.paused) {
        music.play();
      }
    });
  </script>
</body>
</html>
